name: CI

on:

  push:
    branches:
      - automated_testing
      - automated_testing_compare

  # Tuesday 19:00 UTC.
  # schedule:
    # - cron: "0 19 * * 2"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Ask Mojang which Minecraft versions to target: every release from 26.1
  # onwards, and every 26.1 snapshot, pre-release and release candidate.
  get-minecraft-versions:
    name: Discover Minecraft versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.discover.outputs.versions }}
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Query Mojang's version manifest
        id: discover
        run: python3 .armour/scripts/get_minecraft_versions.py --release-from 26.1 --snapshot-after 1.21.11 --exclude 26w14a

  # Lint the pack with Spyglass against every target version.
  # Snapshot failures are reported but never turn the workflow red; releases do.
  lint:

    name: Lint (${{ matrix.id }})
    needs: get-minecraft-versions
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.kind == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.get-minecraft-versions.outputs.matrix) }}

    steps:

      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .armour/scripts/spyglass/package-lock.json

      - name: Install Spyglass
        working-directory: .armour/scripts/spyglass
        run: npm ci --no-audit --no-fund

      # Server jars never change once published, so cache them by SHA-1.
      - uses: actions/cache@v6
        with:
          path: .mc-cache
          key: server-jar-${{ matrix.sha1 }}

      # Spyglass ignores pack.mcmeta overlays, so build the pack as Minecraft
      # would load it for this version: root data/ plus the overlays that apply.
      # The data pack format is read from version.json inside the server jar.
      - name: Build the pack for ${{ matrix.id }}
        run: >
          python3 .armour/scripts/build_version_pack.py
          --server-url "${{ matrix.server_url }}"
          --sha1 "${{ matrix.sha1 }}"
          --cache-dir .mc-cache
          --out build/pack
          --source-map build/source-map.json

      # Spyglass revalidates cached downloads with ETags, so a stale cache is safe.
      - uses: actions/cache@v6
        with:
          path: .spyglass-cache
          key: spyglass-data-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: spyglass-data-${{ matrix.id }}-

      - name: Spyglass lint
        run: >
          node .armour/scripts/spyglass/lint.mjs
          --root build/pack
          --game-version "${{ matrix.id }}"
          --source-map build/source-map.json
          --cache-dir .spyglass-cache
          ${{ matrix.kind == 'snapshot' && '--allow-unsupported' || '' }}

  # Start a real, headless Minecraft server with the pack for every target
  # version. The pack only changes world generation, so there are no functions to
  # test: the server just has to start and load the pack without errors.
  # Snapshot failures are reported but never turn the workflow red; releases do.
  server-load:
    name: Load (${{ matrix.id }})
    needs: get-minecraft-versions
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.kind == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.get-minecraft-versions.outputs.matrix) }}

    steps:

      - uses: actions/checkout@v7
        with:
          submodules: true

      # Each Minecraft version needs its own Java (21 for 1.21.x, 25 for 26.x).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Server jars never change once published, so cache them by SHA-1.
      - uses: actions/cache@v6
        with:
          path: .mc-cache
          key: server-jar-${{ matrix.sha1 }}

      # Snapshots can have a newer pack format than pack.mcmeta declares, so
      # `--kind` lets ARMOUR widen max_format for them (releases run as shipped).
      - name: Load the pack on a Minecraft ${{ matrix.id }} server
        run: >
          python3 .armour/scripts/run_server_tests.py
          --load-only
          --version "${{ matrix.id }}"
          --kind "${{ matrix.kind }}"
          --server-url "${{ matrix.server_url }}"
          --sha1 "${{ matrix.sha1 }}"
          --cache-dir .mc-cache
          --repo .
          --work-dir server-run

      - name: Keep the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.id }}
          path: server-run/server-output.log
          if-no-files-found: ignore
